name: Career watch

on:
  schedule:
    - cron: "30 13 * * *"   # 13:30 UTC = 7:00 PM IST daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: careers-watch
  cancel-in-progress: false

env:
  DIR: .   # folder containing careers_watch.py; use "pipeline" if it lives there

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ env.DIR }}
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run watcher
        working-directory: ${{ env.DIR }}
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
          SHEET_GID: ${{ vars.SHEET_GID }}
          TIMEZONE: Asia/Kolkata
          REGION: IN
          PLACES: ${{ vars.PLACES }}
          ROLE_KEYWORDS: ${{ vars.ROLE_KEYWORDS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ vars.NOTIFY_TO }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: python careers_watch.py

      - name: Save state and history
        if: always()
        working-directory: ${{ env.DIR }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f state.json history.json new.html
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Career watch: $(TZ=Asia/Kolkata date '+%F %H:%M IST')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin ${{ github.ref_name }} && git push && exit 0
            echo "push failed, retry $i"; sleep 5
          done
          exit 1