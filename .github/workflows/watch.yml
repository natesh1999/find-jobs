name: Career watch

on:
  schedule:
    - cron: "30 13 * * *"   # 13:30 UTC = 7:00 PM IST daily
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: careers-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run watcher
        env:
          SHEET_ID: ${{ secrets.SHEET_ID || vars.SHEET_ID }}
          SHEET_GID: ${{ vars.SHEET_GID }}
          TIMEZONE: Asia/Kolkata
          REGION: IN
          PLACES: ${{ vars.PLACES }}
          ROLE_KEYWORDS: ${{ vars.ROLE_KEYWORDS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO || vars.NOTIFY_TO }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: python careers_watch.py

      - name: Save state and history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state.json history.json new.html
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Career watch: $(TZ=Asia/Kolkata date '+%F %H:%M IST')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin ${{ github.ref_name }} && git push && exit 0
            echo "push failed, retry $i"; sleep 5
          done
          exit 1

  deploy:
    needs: watch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}   # includes the bot's latest commit

      - name: Build site
        run: |
          mkdir site
          cp pipeline/new.html site/index.html
          cp pipeline/report.css site/report.css

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
