name: careers-watch
on:
  schedule:
    - cron: "30 13 * * *"   # 7:00 PM IST daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: careers-watch
  cancel-in-progress: false

env:
  DIR: pipeline   # folder containing careers_watch.py ("." if at repo root)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ env.DIR }}
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run watcher
        working-directory: ${{ env.DIR }}
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
          SHEET_GID: ${{ vars.SHEET_GID }}
          TIMEZONE: Asia/Kolkata
          REGION: IN
          ROLE_KEYWORDS: ${{ vars.ROLE_KEYWORDS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ vars.NOTIFY_TO }}
        run: python careers_watch.py

      - name: Save state and history
        if: always()
        working-directory: ${{ env.DIR }}
        run: |
          git config user.name "careers-bot"
          git config user.email "careers-bot@users.noreply.github.com"
          git add -f state.json history.json new.html || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "careers watch $(date -u +%F)"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi